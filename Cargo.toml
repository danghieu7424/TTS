[workspace]
members = [
    "crates/vieneu-tts-core",
    "crates/vieneu-tts-engine",
    "crates/vieneu-tts",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Vietnamese text-to-speech and subtitle dubbing library"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
