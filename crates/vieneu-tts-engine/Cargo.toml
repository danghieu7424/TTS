[package]
name = "vieneu-tts-engine"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Vietnamese text-to-speech and subtitle dubbing library"

[features]
default = ["turbo"]
turbo = [
    "dep:hf-hub",
    "dep:ndarray",
    "dep:ndarray-npy",
    "dep:ort",
    "dep:rand",
    "dep:rand_distr",
    "dep:tokenizers",
]
nano = ["dep:hf-hub", "dep:ndarray", "dep:ndarray-npy", "dep:ort", "dep:rand", "dep:rand_distr"]

[dependencies]
anyhow = "1"
hf-hub = { version = "0.4", optional = true }
ndarray = { version = "0.17", optional = true }
ndarray-npy = { version = "0.11", optional = true }
ort = { version = "=2.0.0-rc.11", features = ["directml", "load-dynamic"], optional = true }
rand = { version = "0.8", optional = true }
rand_distr = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", optional = true }
vieneu-tts-core = { path = "../vieneu-tts-core" }
