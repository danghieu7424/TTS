[package]
name = "vieneu-tts"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[features]
default = ["turbo"]
turbo = ["vieneu-tts-engine/turbo"]
nano = ["vieneu-tts-engine/nano"]

[[example]]
name = "evaluate_vtt"
required-features = ["turbo"]

[dependencies]
anyhow.workspace = true
vieneu-tts-core = { path = "../vieneu-tts-core" }
vieneu-tts-engine = { path = "../vieneu-tts-engine", default-features = false }
