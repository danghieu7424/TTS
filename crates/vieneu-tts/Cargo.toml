[package]
name = "vieneu-tts"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Vietnamese text-to-speech and subtitle dubbing library"

[features]
default = ["turbo"]
turbo = ["vieneu-tts-engine/turbo"]
nano = ["vieneu-tts-engine/nano"]

[[example]]
name = "evaluate_vtt"
required-features = ["turbo"]

[[example]]
name = "debug_noise"
required-features = ["turbo"]

[dependencies]
anyhow = "1"
vieneu-tts-core = { path = "../vieneu-tts-core" }
vieneu-tts-engine = { path = "../vieneu-tts-engine", default-features = false }
